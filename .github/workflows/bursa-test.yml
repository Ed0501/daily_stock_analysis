
name: Bursa Malaysia Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -r .github/requirements-ci.txt
          python -m pip install yfinance

      - name: Run Bursa offline tests
        run: |
          python -m pytest tests/test_bursa_market.py -q

      - name: Check live Bursa market data
        run: |
          python tests/test_bursa_live.py
