
name: Bursa Malaysia Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install -r .github/requirements-ci.txt

      - name: Run Bursa tests
        run: |
          python -m pytest tests/test_bursa_market.py -q
